<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swift Explorer</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1b; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  audio { width: 92%; display: block; margin: 0 auto; }
  body.audio { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<video id="v" controls autoplay playsinline></video>
<script>
  const q = new URLSearchParams(location.search);
  const src = q.get('src') || '';
  const kind = q.get('kind') || 'video';
  if (kind === 'audio') {
    document.body.classList.add('audio');
    const a = document.createElement('audio');
    a.controls = true;
    a.autoplay = true;
    a.src = src;
    document.body.replaceChildren(a);
  } else {
    document.getElementById('v').src = src;
  }
</script>
</body>
</html>
