id: io.github.some_rao.StarFile
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: starfile
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # A file manager needs to see the whole file system
  - --filesystem=host
  # Properties and "Show in file manager" go through the host file manager
  - --talk-name=org.freedesktop.FileManager1
  # "Open in Terminal" starts the host's terminal with flatpak-spawn --host
  - --talk-name=org.freedesktop.Flatpak
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/starfile/cargo
modules:
  - name: starfile
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/starfile /app/bin/starfile
      - install -Dm644 packaging/linux/io.github.some_rao.StarFile.desktop /app/share/applications/io.github.some_rao.StarFile.desktop
      - install -Dm644 packaging/linux/io.github.some_rao.StarFile.metainfo.xml /app/share/metainfo/io.github.some_rao.StarFile.metainfo.xml
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/256x256/apps/io.github.some_rao.StarFile.png
    sources:
      # Flathub builds from a tagged git source instead; see packaging/flatpak/README.md
      - type: dir
        path: ../..
        skip:
          - target
          - build-dir
          - .flatpak-builder
      # Generated from Cargo.lock by flatpak-cargo-generator (done in CI)
      - cargo-sources.json
