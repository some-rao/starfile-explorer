name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: starfile.exe
            asset: StarFile.exe
          - os: ubuntu-22.04
            bin: starfile
            asset: starfile-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Rename binary
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "packaging\windows\starfile.iss"
          Copy-Item "dist\StarFile-Setup-$ver.exe" "StarFile-Setup.exe"
      - name: Package tar.gz
        if: runner.os == 'Linux'
        run: |
          mkdir starfile
          cp target/release/starfile LICENSE NOTICE starfile/
          cp packaging/linux/io.github.some_rao.StarFile.desktop packaging/linux/io.github.some_rao.StarFile.metainfo.xml starfile/
          cp assets/icon.png starfile/io.github.some_rao.StarFile.png
          chmod 755 starfile/starfile
          tar -czf "${{ matrix.asset }}.tar.gz" starfile
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}*
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: StarFile-Setup
          path: StarFile-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}*
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: StarFile-Setup.exe

  # Uygulama yeni surumu API yerine bu dosyadan ogrenir: istek siniri yok
  manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StarFile.exe
      - name: Write latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          sha=$(sha256sum StarFile.exe | cut -d' ' -f1)
          jq -n --arg v "$version" --arg page "$base/tag/$GITHUB_REF_NAME" \
                --arg url "$base/download/$GITHUB_REF_NAME/StarFile.exe" --arg sha "$sha" \
                '{version: $v, page: $page, windows: {url: $url, sha256: $sha}}' > latest.json
          cat latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: latest.json

  flatpak-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cargo-sources.json
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install aiohttp tomlkit pyyaml
          curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          /tmp/venv/bin/python flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-sources
          path: cargo-sources.json

  flatpak:
    needs: flatpak-sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: starfile.flatpak
          manifest-path: packaging/flatpak/io.github.some_rao.StarFile.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: starfile.flatpak
